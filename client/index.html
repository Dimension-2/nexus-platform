<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus – Investor & Entrepreneur</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest: #0d2818;
        --forest-mid: #163320;
        --forest-lt: #1e4a2e;
        --cream: #f5f0e8;
        --cream-lt: #faf7f2;
        --gold: #c9a84c;
        --gold-lt: #e0c068;
        --gold-dk: #a07830;
        --text-dark: #1a1a1a;
        --text-mid: #5a5a52;
        --text-lt: #8a8a7e;
        --border: #ddd8cc;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Montserrat", sans-serif;
        background: var(--cream);
        min-height: 100vh;
        display: flex;
      }

      /* ───── LEFT PANEL ───── */
      .left-panel {
        width: 50%;
        background: var(--forest);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .left-panel::before {
        content: "";
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(201, 168, 76, 0.07) 0%,
          transparent 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .corner {
        position: absolute;
        width: 200px;
        height: 200px;
        opacity: 0.12;
      }
      .corner svg {
        width: 100%;
        height: 100%;
      }
      .corner--tl {
        top: 0;
        left: 0;
      }
      .corner--br {
        bottom: 0;
        right: 0;
        transform: rotate(180deg);
      }

      .rule-h {
        position: absolute;
        left: 60px;
        right: 60px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(201, 168, 76, 0.4),
          transparent
        );
      }
      .rule-h--top {
        top: 60px;
      }
      .rule-h--bot {
        bottom: 60px;
      }
      .rule-v {
        position: absolute;
        top: 60px;
        bottom: 60px;
        width: 1px;
        background: linear-gradient(
          180deg,
          transparent,
          rgba(201, 168, 76, 0.4),
          transparent
        );
      }
      .rule-v--l {
        left: 60px;
      }
      .rule-v--r {
        right: 60px;
      }

      .brand-center {
        position: relative;
        z-index: 2;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .monogram {
        font-family: "Cormorant Garamond", serif;
        font-size: 6.5rem;
        font-weight: 300;
        color: var(--gold);
        line-height: 1;
        letter-spacing: -0.02em;
        margin-bottom: 0.1em;
        filter: drop-shadow(0 4px 24px rgba(201, 168, 76, 0.25));
      }
      .brand-name {
        font-family: "Montserrat", sans-serif;
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: 0.45em;
        color: var(--cream);
        text-transform: uppercase;
      }
      .brand-sub {
        font-family: "Montserrat", sans-serif;
        font-size: 0.55rem;
        font-weight: 400;
        letter-spacing: 0.35em;
        color: rgba(245, 240, 232, 0.45);
        text-transform: uppercase;
        margin-top: 0.55rem;
      }
      .divider-line {
        width: 48px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
        margin: 1.6rem auto;
      }
      .tagline {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.15rem;
        font-style: italic;
        font-weight: 400;
        color: rgba(245, 240, 232, 0.65);
        letter-spacing: 0.01em;
        line-height: 1.6;
      }

      /* ───── RIGHT PANEL ───── */
      .right-panel {
        width: 50%;
        background: var(--cream-lt);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 5rem;
      }
      .form-card {
        width: 100%;
        max-width: 440px;
      }
      .form-heading {
        font-family: "Cormorant Garamond", serif;
        font-size: 2.8rem;
        font-weight: 600;
        color: var(--text-dark);
        letter-spacing: -0.01em;
        line-height: 1.15;
        margin-bottom: 0.7rem;
      }
      .form-sub {
        font-size: 0.72rem;
        font-weight: 400;
        color: var(--text-lt);
        letter-spacing: 0.02em;
        line-height: 1.7;
        margin-bottom: 2.4rem;
      }
      .field-group {
        margin-bottom: 1.5rem;
      }
      .field-label {
        display: block;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--text-mid);
        text-transform: uppercase;
        margin-bottom: 0.65rem;
      }
      .field-input {
        width: 100%;
        padding: 0.85rem 1.1rem;
        background: #fff;
        border: 1px solid var(--border);
        font-family: "Montserrat", sans-serif;
        font-size: 0.82rem;
        font-weight: 400;
        color: var(--text-dark);
        outline: none;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
        -webkit-appearance: none;
      }
      .field-input::placeholder {
        color: #bbb8ae;
      }
      .field-input:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
      }

      .role-group {
        margin-bottom: 2rem;
      }
      .role-btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }
      .role-btn {
        padding: 0.85rem;
        font-family: "Montserrat", sans-serif;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-mid);
        transition: 0.25s;
      }
      .role-btn:first-child {
        border-right: none;
      }
      .role-btn.active {
        background: var(--forest);
        color: var(--cream);
        border-color: var(--forest);
      }
      .role-btn:not(.active):hover {
        background: var(--cream);
        border-color: var(--gold);
        color: var(--text-dark);
      }

      .signin-btn {
        width: 100%;
        padding: 1.05rem;
        background: var(--forest);
        color: var(--cream);
        font-family: "Montserrat", sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        border: none;
        cursor: pointer;
        transition:
          background 0.25s,
          transform 0.15s;
        margin-bottom: 1.5rem;
      }
      .signin-btn:hover {
        background: var(--forest-lt);
        transform: translateY(-1px);
      }
      .signup-line {
        text-align: center;
        font-size: 0.68rem;
        color: var(--text-lt);
        letter-spacing: 0.02em;
      }
      .signup-line span {
        color: var(--gold-dk);
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
        transition: color 0.2s;
      }
      .signup-line span:hover {
        color: var(--gold);
      }

      @media (max-width: 900px) {
        .left-panel {
          display: none;
        }
        .right-panel {
          width: 100%;
          padding: 3rem 2rem;
        }
      }
    </style>
    <style>
  @keyframes drawLine{from{stroke-dashoffset:300;stroke-dasharray:300}to{stroke-dashoffset:0;stroke-dasharray:300}}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.75;transform:scale(1.15)}}
  @keyframes expandH{from{width:0}to{width:100%}}
  @keyframes expandV{from{height:0}to{height:100%}}
  @keyframes floatA{0%,100%{transform:translateY(0) rotate(0deg);opacity:.18}50%{transform:translateY(-20px) rotate(180deg);opacity:.36}}
  @keyframes floatB{0%,100%{transform:translate(0,0) rotate(45deg);opacity:.13}33%{transform:translate(8px,-14px) rotate(90deg);opacity:.28}66%{transform:translate(-6px,8px) rotate(135deg);opacity:.18}}
  @keyframes floatC{0%,100%{transform:translateY(0) scale(1);opacity:.15}50%{transform:translateY(-16px) scale(1.12);opacity:.3}}
  @keyframes drift{0%,100%{transform:translate(0,0) rotate(12deg);opacity:.12}25%{transform:translate(6px,-10px) rotate(30deg);opacity:.22}75%{transform:translate(-5px,10px) rotate(-4deg);opacity:.17}}
  @keyframes orb{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(10px,-16px);opacity:.4}}
  @keyframes shimmer{0%,100%{opacity:.06}50%{opacity:.18}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes glowPulse{0%,100%{text-shadow:0 0 18px rgba(201,168,76,.25)}50%{text-shadow:0 0 38px rgba(201,168,76,.7),0 0 70px rgba(201,168,76,.25)}}
  @keyframes lineFade{0%,100%{opacity:.25}50%{opacity:.55}}
</style>

      <ellipse cx="20" cy="45" rx="8" ry="4" fill="none" stroke="#c9a84c" stroke-width=".5" transform="rotate(60 20 45)" opacity=".35" style="animation:pulse 6s 2s infinite ease-in-out;"/>

    <div class="right-panel">
      <div class="form-card">
        <h1 class="form-heading" id="formTitle">Welcome Back</h1>
        <p class="form-sub" id="formSub">
          Please enter your credentials to access your dashboard.
        </p>

        <form id="authForm">
          <div class="field-group" id="nameGroup" style="display: none">
            <label class="field-label">Full Name</label>
            <input
              class="field-input"
              type="text"
              id="fullName"
            placeholder="Enter your full name"
            />
          </div>

          <div class="field-group">
            <label class="field-label">Email Address</label>
            <input
              class="field-input"
              type="email"
              id="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="field-group">
            <label class="field-label">Password</label>
            <input
              class="field-input"
              type="password"
              id="password"
              placeholder="Enter your password  (8+ characters) "
              required
            />
          </div>

          <div class="role-group">
            <label class="field-label">Select Your Platform Role</label>
            <div class="role-btns">
              <button
                type="button"
                class="role-btn active"
                onclick="setRole(this, 'Entrepreneur')"
              >
                Entrepreneur
              </button>

              <button
                type="button"
                class="role-btn"
                onclick="setRole(this, 'Investor')"
              >
                Investor
              </button>
            </div>
          </div>

          <button type="submit" class="signin-btn" id="submitBtn">
            Sign In to Nexus
          </button>
        </form>

        <p class="signup-line">
          <span id="toggleText">Don't have an account?</span>
          <span id="toggleBtn" onclick="toggleMode()">Sign Up Here</span>
        </p>
      </div>
    </div>

    <script>
      let isLogin = true;

      // Function to handle role selection buttons
      function setRole(btn, role) {
        document
          .querySelectorAll(".role-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
      }

      // Function to toggle between Login and Signup UI
      function toggleMode() {
        isLogin = !isLogin;
        const title = document.getElementById("formTitle");
        const sub = document.getElementById("formSub");
        const btn = document.getElementById("submitBtn");
        const nameGroup = document.getElementById("nameGroup");
        const toggleText = document.getElementById("toggleText");
        const toggleBtn = document.getElementById("toggleBtn");

        if (isLogin) {
          title.textContent = "Welcome Back";
          sub.textContent =
            "Please enter your credentials to access your dashboard.";
          btn.textContent = "Sign In to Nexus";
          toggleText.textContent = "Don't have an account?";
          toggleBtn.textContent = "Sign Up Here";
          nameGroup.style.display = "none";
        } else {
          title.textContent = "Create Account";
          sub.textContent = "Join the network to start collaborating.";
          btn.textContent = "Create Account";
          toggleText.textContent = "Already have an account?";
          toggleBtn.textContent = "Sign In Here";
          nameGroup.style.display = "block";
        }
      }

      // The Form Submit Logic - Full Registration and Login using LocalStorage
      document
        .getElementById("authForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Get input values
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();

          // Find which role button is currently active
          const activeRoleBtn = document.querySelector(".role-btn.active");
          const role = activeRoleBtn
            ? activeRoleBtn.textContent.trim()
            : "Entrepreneur";

          // Fetch existing users from local storage, or create an empty object if none exist
          const users = JSON.parse(localStorage.getItem("nexusUsers")) || {};

          if (!isLogin) {
            // --- SIGN UP LOGIC ---
            const fullName = document.getElementById("fullName").value.trim();

            if (users[email]) {
              alert(
                "An account with this email already exists! Please log in.",
              );
              return;
            }

            // Save new user credentials and data
            users[email] = {
              name: fullName,
              password: password,
              role: role,
            };
            localStorage.setItem("nexusUsers", JSON.stringify(users));

            alert("Account created successfully! Please sign in.");

            // Clear the form and switch the UI back to Login mode
            document.getElementById("authForm").reset();
            toggleMode();
          } else {
            // --- LOG IN LOGIC ---
            const user = users[email];

            // Check if user exists and password matches
            if (user && user.password === password) {
              // Save the active session so dashboard.html can know who is logged in
              localStorage.setItem(
                "nexusActiveUser",
                JSON.stringify({
                  email: email,
                  name: user.name,
                  role: user.role,
                }),
              );

              // Redirect to the dashboard
              window.location.href = "src/pages/dashboard.html";
            } else {
              alert("Invalid email or password. Please try again.");
            }
          }
        });
    </script>
